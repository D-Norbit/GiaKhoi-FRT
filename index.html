  const ready=()=>!!gd;
  const full=()=>!!(gd&&gd.khoiKey);
  function set(x){gd=(x&&x.url&&x.key)?x:null;notes=null;}
  function rnd(n){const a=crypto.getRandomValues(new Uint8Array(n));let s='';a.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/[+/=]/g,'');}
  function fmtSize(n){n=+n||0;return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1).replace('.',',')+' MB';}
  function topics(){return ['Chung',...CASES.map(c=>c.code+' – '+c.title),...Object.values(B_META).map(b=>b.title),'Tự soi','Buổi tổng kết'];}

  async function call(action,payload={},opts={},cred=gd){
    const body=JSON.stringify(Object.assign({key:cred.key,action},payload));
    let r;
    try{r=await fetch(cred.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow',keepalive:!!opts.keepalive&&body.length<60000});}
    catch(e){throw new Error('Không gọi được Google Apps Script. Kiểm tra mạng, và khi triển khai mục "Người có quyền truy cập" phải là "Bất kỳ ai".');}
    if(!r.ok)throw new Error('Google Apps Script trả lỗi '+r.status+'.');
    let j;try{j=await r.json();}catch(e){throw new Error('Phản hồi không hợp lệ. Kiểm tra URL (phải kết thúc bằng /exec) và quyền truy cập "Bất kỳ ai".');}

  }

  /* ----- Sao lưu hồ sơ (Khôi: tự động; mentor: lấy từ GitHub) ----- */
  async function backup(md,opts={}){
    if(!ready()||!md)return false;
    const h=hashStr(md);
    if(!opts.force&&localStorage.getItem(HASHK)===h)return true;
    if(busy){again=true;return busy;}
    busy=(async()=>{
      try{await call('backup',{md},{keepalive:opts.keepalive});localStorage.setItem(HASHK,h);localStorage.setItem(LAST,new Date().toISOString());lastErr='';return true;}
      catch(e){lastErr=e.message;return false;}
      finally{lastAt=Date.now();}
    })();
    const ok=await busy;busy=null;
    if(again){again=false;schedule();}
    return ok;
  }
  function schedule(){
    if(!ready()||APP.role!=='khoi')return;
    clearTimeout(timer);
    timer=setTimeout(()=>backup(buildMarkdown()),Math.max(0,60000-(Date.now()-lastAt)));
  }
  function flush(){if(!ready()||APP.role!=='khoi')return;clearTimeout(timer);backup(buildMarkdown(),{keepalive:true});}
  async function seed(cred=gd){
    const h={'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'};if(gh.token)h['Authorization']='Bearer '+gh.token;
    const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(gh.branch)}&t=${Date.now()}`,{headers:h,cache:'no-store'});
    if(r.status===404)return false;
    if(!r.ok)throw new Error('Không đọc được hồ sơ trên GitHub ('+r.status+').');

    return true;
  }
  function khoiStatus(){
    if(!ready())return `<p style="margin:0">Chưa bật. Mentor bật trong mục <b>Kết nối</b>; sau đó em đăng xuất và đăng nhập lại.</p>`;

    <div class="row-actions"><button data-dact="backup">Sao lưu ngay</button></div>

  /* ----- Thiết lập (mentor) ----- */
  function pendingKeys(){

  const jsq=s=>String(s).replace(/[\\']/g,'\\$&');
  function code(k){return GAS_TEMPLATE.split('%%KHOI_KEY%%').join(k.khoi).split('%%MENTOR_KEY%%').join(k.mentor).split('%%FOLDER%%').join(jsq(PROGRAM.title+' – Sao lưu')).split('%%SLUG%%').join(jsq(PROGRAM.slug)).split('%%READING%%').join(jsq(READING_TITLE));}
  function setupHtml(){
    const k=pendingKeys(),folder=localStorage.getItem(FOLDER),on=ready()&&full();
    const fresh=!!localStorage.getItem(PEND)&&on;
    const mpwMissing=!sessionStorage.getItem(SK('mpw'));
    return `<h2 id="drive">Sao lưu Google Drive</h2>
    ${on&&(+localStorage.getItem(VER)||GAS_VERSION)<GAS_VERSION?`<div class="card rshare warn"><b>Cần cập nhật mã Apps Script</b> để dùng mục Tài liệu cần đọc. Làm theo phần <b>Cập nhật mã Apps Script</b> bên dưới (khoảng 2 phút).</div>`:''}
    ${on?`<div class="card"><b>Đã bật.</b> Sau mỗi lần Khôi hoặc mentor cập nhật, hệ thống ghi file <b>backup-data-${esc(PROGRAM.slug)}.md</b> vào Google Drive, kèm một bản theo từng ngày. ${folder?`<a href="${esc(folder)}" target="_blank" rel="noopener">Mở thư mục sao lưu</a>`:''}
      <div class="row-actions" style="margin-top:10px"><button data-dact="seed">Sao lưu ngay</button><button data-dact="test">Kiểm tra kết nối</button></div><div id="dMsg2" style="margin-top:8px;font-size:14px"></div></div>`
    :`<p>Chưa bật. Làm theo 5 bước dưới đây, khoảng 10 phút. Dữ liệu hiện có trên GitHub giữ nguyên và sẽ được sao lưu ngay khi kết nối xong.</p>`}
    <details class="card" ${on&&!fresh?'':'open'}><summary><b>${on?'Thiết lập lại hoặc xem lại mã':'Các bước thiết lập'}</b></summary>
    ${fresh?'<p style="color:var(--warn)">Đã tạo khóa mới. Sao chép lại mã, dán đè trong Apps Script, triển khai phiên bản mới, rồi bấm Kết nối.</p>':''}
    <ol class="dsteps">
      <li><b>Sao chép mã.</b> <button data-dact="copy">Sao chép mã Apps Script</button>
        <textarea id="dCode" readonly rows="5" style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(code(k))}</textarea>
        <span class="muted" style="font-size:13px">Mã đã chứa sẵn khóa riêng của chương trình. Không chia sẻ mã này.</span></li>
      <li><b>Tạo dự án.</b> Mở <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">script.google.com</a> bằng tài khoản Google sẽ chứa bản sao lưu → xóa mã mẫu, dán mã vừa sao chép → bấm biểu tượng <b>Lưu</b>.</li>
      <li><b>Cấp quyền.</b> Ở thanh công cụ, chọn hàm <code>caiDat</code> → <b>Chạy</b> → chọn tài khoản. Nếu thấy "Google chưa xác minh ứng dụng này": <b>Nâng cao</b> → <b>Đi tới … (không an toàn)</b> → <b>Cho phép</b>.</li>
      <li><b>Triển khai.</b> <b>Triển khai → Tùy chọn triển khai mới</b> → biểu tượng bánh răng → <b>Ứng dụng web</b> → Thực thi với tư cách: <b>Tôi</b> → Người có quyền truy cập: <b>Bất kỳ ai</b> → <b>Triển khai</b> → sao chép <b>URL ứng dụng web</b> (kết thúc bằng <code>/exec</code>).</li>

        <div class="field-row" style="margin-top:10px"><div><label>Mật khẩu của Khôi</label><input type="password" id="dKhoi"></div>${mpwMissing?'<div><label>Mật khẩu mentor</label><input type="password" id="dMentor"></div>':'<div></div>'}</div>

        <div id="dMsg" style="margin-top:10px;font-size:14px"></div></li>
    </ol></details>
    ${on?`<details class="card" ${(+localStorage.getItem(VER)||GAS_VERSION)<GAS_VERSION?'open':''} id="dUpdate"><summary><b>Cập nhật mã Apps Script</b> <span class="muted" style="font-size:13px">khi webapp có tính năng mới, giữ nguyên đường link</span></summary>
      <ol class="dsteps">
        <li>Mở phần <b>Thiết lập lại hoặc xem lại mã</b> ở trên → bấm <b>Sao chép mã Apps Script</b> (mã giữ nguyên khóa đang dùng).</li>

        <li><b>Triển khai → Quản lý các bản triển khai</b> → chọn bản đang dùng → biểu tượng <b>bút chì</b> (Chỉnh sửa) → Phiên bản: <b>Phiên bản mới</b> → <b>Triển khai</b>. Nếu Google hỏi cấp quyền thì bấm Cho phép.</li>

  async function connect(){
    const m=t=>{el('dMsg').innerHTML=t;},fail=t=>m(`<span style="color:var(--warn)">${t}</span>`);
    const url=el('dUrl').value.trim().replace(/\/+$/,''),kpw=el('dKhoi').value;
    const mpw=sessionStorage.getItem(SK('mpw'))||(el('dMentor')?el('dMentor').value:'');
    if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/.test(url))
      return fail(/\/dev$/.test(url)?'Đây là đường link thử nghiệm (/dev). Hãy dùng <b>URL ứng dụng web</b> kết thúc bằng <b>/exec</b> hiện ra sau khi bấm Triển khai.':'URL chưa đúng. URL ứng dụng web có dạng <code>https://script.google.com/macros/s/…/exec</code>.');
    if(!kpw)return fail('Hãy nhập mật khẩu của Khôi.');
    if((await Auth.sha(kpw))!==Auth.ROLE_SHA.khoi)return fail('Mật khẩu của Khôi chưa đúng.');
    if(!mpw||(await Auth.sha(mpw))!==Auth.ROLE_SHA.mentor)return fail('Mật khẩu mentor chưa đúng.');
    if(!(gh.owner&&gh.repo&&gh.token))return fail('Cần kết nối GitHub trước (phần phía trên).');
    const k=pendingKeys();
    try{
      m('Đang kiểm tra Apps Script…');
      const p=await call('ping',{},{},{url,key:k.mentor});
      await call('ping',{},{},{url,key:k.khoi});
      if(p.folderUrl)localStorage.setItem(FOLDER,p.folderUrl);noteVersion(p.version);
      m('Đang lưu cấu hình (mã hóa bằng mật khẩu)…');
      const H={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
      const A=x=>`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}${x}`;
      const ri=await fetch(A(''),{headers:H});if(!ri.ok)return fail('Không đọc được thông tin kho GitHub ('+ri.status+').');
      const main=(await ri.json()).default_branch||'main';
      const cur=await fetch(A('/contents/config.json?ref='+encodeURIComponent(main)+'&t='+Date.now()),{headers:H,cache:'no-store'});
      if(!cur.ok)return fail('Không đọc được config.json trên GitHub ('+cur.status+'). Hãy kết nối GitHub trước.');
      const cj=await cur.json();const cfg=JSON.parse(b64dec(cj.content));
      cfg.gd={khoi:await Auth.enc(kpw,JSON.stringify({url,key:k.khoi})),mentor:await Auth.enc(mpw,JSON.stringify({url,key:k.mentor,khoiKey:k.khoi}))};
      const w=await fetch(A('/contents/config.json'),{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Bật sao lưu Google Drive',branch:main,sha:cj.sha,content:b64enc(JSON.stringify(cfg,null,2))})});
      if(!w.ok)return fail('Không ghi được config.json ('+w.status+').');
      localStorage.setItem(Auth.CONFIG_CACHE,JSON.stringify(cfg));localStorage.removeItem(PEND);
      const s=Auth.readSession()||{};s.gd={url,key:k.mentor,khoiKey:k.khoi};Auth.saveSession(s,!!localStorage.getItem(Auth.SESSION_KEY));set(s.gd);
      m('Đang tạo bản sao lưu đầu tiên từ dữ liệu hiện có…');
      const ok=await seed();
      route_keep();
      el('dMsg2').innerHTML=`<span style="color:var(--accent)"><b>Đã bật sao lưu Google Drive.</b> ${ok?'Đã sao lưu toàn bộ dữ liệu hiện có.':'Chưa có hồ sơ của Khôi; bản đầu tiên sẽ được tạo khi Khôi cập nhật.'} Đợi 1–2 phút để GitHub Pages cập nhật; lần tới Khôi mở app có thể được hỏi lại mật khẩu một lần.</span>`;
    }catch(e){fail(esc(e.message));}
  }
  function newKeys(){if(!confirm('Tạo khóa mới? Sau đó cần dán lại mã mới vào Apps Script và triển khai phiên bản mới.'))return;localStorage.setItem(PEND,JSON.stringify({khoi:'k'+rnd(18),mentor:'m'+rnd(18)}));route_keep();}
  async function copyCode(){const t=el('dCode');try{await navigator.clipboard.writeText(t.value);toast('Đã sao chép mã Apps Script');}catch(e){t.focus();t.select();try{document.execCommand('copy');toast('Đã sao chép mã Apps Script');}catch(x){toast('Hãy nhấn Ctrl+C (hoặc Cmd+C) để sao chép');}}}

      else{say('Đang sao lưu…');const ok=await seed();say(ok?'Đã sao lưu bản mới nhất lên Google Drive.':'Chưa có hồ sơ của Khôi trên GitHub.');}

  function msg(t,bad){const b=el('nMsg');if(b)b.innerHTML=`<span style="color:var(--${bad?'warn':'accent'})">${esc(t)}</span>`;}
  function paintFiles(){const b=el('nFileList');if(!b)return;b.innerHTML=files.map((f,i)=>`<span class="nfile">${esc(f.name)} · ${fmtSize(f.size)} <button class="linkbtn" data-dnrm="${i}">Bỏ</button></span>`).join('');}
  function saveDraft(){const v=id=>el(id)?el(id).value:'';try{sessionStorage.setItem(DRAFT,JSON.stringify({date:v('nDate'),author:v('nAuthor'),type:v('nType'),topic:v('nTopic'),text:v('nText')}));}catch(e){}}
  const okThumb=t=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t||'');

  function paintNotes(){
    const box=el('nList');if(!box)return;

    if(notesErr){box.innerHTML=`<div class="merr">${esc(notesErr)}</div>`;return;}
    const all=(notes||[]).slice().sort((a,b)=>String(b.date+b.createdAt).localeCompare(String(a.date+a.createdAt)));
    const ql=q.trim().toLowerCase();
    const list=all.filter(n=>!ql||[n.text,n.type,n.topic,n.author,n.date,(n.files||[]).map(f=>f.name).join(' ')].join(' ').toLowerCase().includes(ql));
    el('nCount').textContent=`Các ghi nhận (${all.length})`;
    if(!list.length){box.innerHTML=`<p class="muted">${all.length?'Không có ghi nhận phù hợp.':'Chưa có ghi nhận nào.'}</p>`;return;}
    box.innerHTML=list.map(n=>`<div class="note"><div class="note-head"><b>${esc(n.date)}</b>${n.type?`<span class="chip">${esc(n.type)}</span>`:''}${n.topic&&n.topic!=='Chung'?`<span class="chip">${esc(n.topic)}</span>`:''}
      <span class="muted" style="font-size:13px;margin-left:auto">${n.author?esc(n.author)+' · ':''}${n.createdAt?fmtDateTime(n.createdAt):''}</span><button class="linkbtn" data-dnote="${esc(n.id)}" style="color:var(--warn)">Xóa</button></div>
      ${n.text?`<div class="note-text">${esc(n.text)}</div>`:''}
      ${(n.files||[]).length?`<div class="nthumbs">${n.files.map(f=>okThumb(f.thumb)&&okUrl(f.url)?`<a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)}"><img src="${f.thumb}" alt="${esc(f.name)}"></a>`:`<a class="nfile" href="${okUrl(f.url)?esc(f.url):'#'}" target="_blank" rel="noopener"><b>${/pdf/i.test(f.mimeType||f.name||'')?'PDF':'Tệp'}</b> ${esc(f.name)} · ${fmtSize(f.size)}</a>`).join('')}</div>`:''}</div>`).join('');
  }
  async function loadNotes(){notesLoading=true;notesErr='';paintNotes();try{const j=await call('listActivities');notes=j.items||[];if(j.folderUrl)localStorage.setItem(FOLDER,j.folderUrl);}catch(e){notesErr=e.message;}notesLoading=false;paintNotes();}
  function loadImg(file){return new Promise(res=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i.naturalWidth?i:null);setTimeout(()=>URL.revokeObjectURL(u),1000);};i.onerror=()=>{URL.revokeObjectURL(u);res(null);};i.src=u;});}
  function draw(img,max){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c;}
  function toJpeg(img,max,qual){return new Promise(res=>draw(img,max).toBlob(b=>res(b),'image/jpeg',qual));}
  function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('Không đọc được tệp'));r.readAsDataURL(blob);});}
  async function prep(file){
    if(file.size>15*1024*1024)throw new Error(`Tệp "${file.name}" lớn hơn 15MB.`);
    let blob=file,name=file.name,type=file.type||'application/octet-stream',thumb='';
    if(/^image\//.test(type)&&type!=='image/gif'){
      const img=await loadImg(file);
      if(img){
        if(file.size>1.5*1024*1024||Math.max(img.naturalWidth,img.naturalHeight)>2000){const j=await toJpeg(img,2000,0.85);if(j){blob=j;name=name.replace(/\.[^.]+$/,'')+'.jpg';type='image/jpeg';}}
        thumb=draw(img,240).toDataURL('image/jpeg',0.7);
      }
    }
    return {size:blob.size,out:{name,mimeType:type,data:await toB64(blob),thumb}};
  }
  async function save(){
    if(saving)return;
    const text=el('nText').value.trim();
    if(!text&&!files.length)return msg('Hãy nhập nội dung hoặc chọn tệp.',true);
    saving=true;const b=el('nSave');b.disabled=true;

      if(total>30*1024*1024)throw new Error('Tổng dung lượng tệp vượt 30MB. Hãy chia thành nhiều lần lưu.');
      b.textContent='Đang lưu lên Google Drive…';
      const author=el('nAuthor').value.trim();try{localStorage.setItem(AUTHOR,author);}catch(e){}
      const j=await call('addActivity',{entry:{date:el('nDate').value||todayStr(),type:el('nType').value,topic:el('nTopic').value,author,text},files:out});
      notes=[j.item,...(notes||[])];files=[];
      el('nText').value='';saveDraft();paintFiles();paintNotes();
      msg('Đã lưu ghi nhận và cập nhật file backup data trên Google Drive.');
    }catch(e){msg(e.message,true);}
    finally{saving=false;b.disabled=false;b.textContent='Lưu ghi nhận';}
  }
  async function del(id){
    if(!confirm('Xóa ghi nhận này? Tệp đính kèm sẽ được chuyển vào Thùng rác của Google Drive.'))return;
    try{await call('deleteActivity',{id});notes=(notes||[]).filter(n=>n.id!==id);paintNotes();toast('Đã xóa ghi nhận');}catch(e){toast(e.message);}
  }
  async function backupNow(){const ok=await backup(buildMarkdown(),{force:true});toast(ok?'Đã sao lưu lên Google Drive':'Chưa sao lưu được: '+lastErr);route_keep();}

  view.addEventListener('click',e=>{
    const t=e.target.closest('[data-dact],[data-dnote],[data-dnrm]');if(!t)return;
    if(t.dataset.dnote){del(t.dataset.dnote);return;}
    if(t.dataset.dnrm!==undefined){files.splice(+t.dataset.dnrm,1);paintFiles();return;}
    const a=t.dataset.dact;
    if(a==='copy')copyCode();else if(a==='connect')connect();else if(a==='newkeys')newKeys();
    else if(a==='seed'||a==='test')mentorAction(a);else if(a==='save')save();

  view.addEventListener('input',e=>{const id=e.target.id;if(id==='nSearch'){q=e.target.value;paintNotes();}else if(['nText','nDate','nAuthor','nType','nTopic'].includes(id))saveDraft();});
  return {set,ready,schedule,flush,khoiStatus,setupHtml,notesView,call,noteVersion};
})();

const Reading=(()=>{

  function marks(){if(isM()){const S=Profile.snap();return (S&&S.reading)||{};}return state.reading||{};}
  function fmtD(s){if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;}
  function fmtSize(n){n=+n||0;if(!n)return '';return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1).replace('.',',')+' MB';}
  function kind(m,n){m=m||'';n=(n||'').toLowerCase();

    if(m==='application/vnd.google-apps.document')return 'Google Docs';
    if(m==='application/vnd.google-apps.spreadsheet')return 'Google Sheets';
    if(m==='application/vnd.google-apps.presentation')return 'Google Slides';
    if(m==='application/vnd.google-apps.form')return 'Google Forms';
    if(/wordprocessingml|msword/.test(m)||/\.docx?$/.test(n))return 'Word';
    if(/presentationml|powerpoint/.test(m)||/\.pptx?$/.test(n))return 'PowerPoint';
    if(/spreadsheetml|excel/.test(m)||/\.xlsx?$/.test(n))return 'Excel';
    if(/epub/.test(m)||/\.epub$/.test(n))return 'EPUB';
    if(/^video\//.test(m))return 'Video';if(/^audio\//.test(m))return 'Âm thanh';if(/^image\//.test(m))return 'Ảnh';
    if(/^text\//.test(m))return 'Văn bản';return 'Tệp';}
  function bList(){return Object.keys(B_META).filter(b=>READ[b]).map(b=>{

  function allIds(){const ids=[];bList().forEach(x=>{ids.push(`B:${x.b}:book`);if(x.r.art)ids.push(`B:${x.b}:art`);});(data&&data.items||[]).forEach(i=>ids.push('D:'+i.id));return ids;}
  const strip=h=>String(h||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();

  function render(){

    <p class="lead">${isM()?'Danh sách Khôi nhìn thấy: bài đọc gợi ý theo B1–B4 và tài liệu trong thư mục Google Drive. Thêm tài liệu bằng cách bỏ tệp vào thư mục trên Drive (mỗi thư mục con là một môn học hoặc chủ đề); hệ thống tự liệt kê và lấy đường link. Cột bên phải cho biết Khôi đã đánh dấu đọc hay chưa.':'Bài đọc gợi ý theo B1–B4 và các tài liệu mentor chọn trên Google Drive. Bấm vào tên để mở đọc; đọc xong thì tích <b>Đã đọc</b> để mentor biết.'}</p>
    <div id="rTop"></div>

        const isNew=!mk['D:'+i.id]&&i.updated&&new Date(i.updated).getTime()>week;
        const meta=[kind(i.mime,i.name),fmtSize(i.size),i.updated?'cập nhật '+fmtD(new Date(i.updated).toISOString().slice(0,10)):''].filter(Boolean).map(esc).join(' · ');
        return item('D:'+i.id,i.name,`${okUrl(i.url)?`<a class="rtitle" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>`:esc(i.name)}${isNew?' <span class="chip due">mới</span>':''}`,meta,i.desc);
      }).join('')).join('');
      const dn=all.filter(i=>mk['D:'+i.id]).length;
      return `<details class="card rgroup" open><summary><b>${esc(g||'Chung')}</b> <span class="muted" style="font-size:13px">${dn}/${all.length} đã đọc</span>${isM()&&okUrl(G.url)?` <a href="${esc(G.url)}" target="_blank" rel="noopener" style="font-size:13px">Mở trên Drive</a>`:''}</summary>${body||'<p class="muted" style="font-size:14px">Thư mục chưa có tài liệu.</p>'}</details>`;
    }).join('');
    box.innerHTML=(out||'<p class="muted">Không có tài liệu phù hợp.</p>')+(data.truncated?'<p class="muted" style="font-size:13px">Chỉ hiện 1.000 tệp đầu tiên.</p>':'');
  }
  async function load(){
    if(!Drive.ready()){paint();return;}
    loading=true;err='';paint();
    try{
      const j=await Drive.call('listReading');
      data={items:j.items||[],folders:j.folders||[],folderUrl:j.folderUrl||'',share:j.share||'',truncated:!!j.truncated,at:new Date().toISOString()};
      Drive.noteVersion(j.version);
      try{localStorage.setItem(CACHE,JSON.stringify(data));}catch(e){}
    }catch(e){
      err=/Thao tác không hợp lệ|Không có quyền/.test(e.message)
        ?(isM()?'Mã Apps Script đang là bản cũ nên chưa đọc được thư mục tài liệu. Vào <a href="#/setup">Kết nối</a> → Sao lưu Google Drive → làm theo mục <b>Cập nhật mã Apps Script</b> (khoảng 2 phút, giữ nguyên đường link).':'Mentor cần cập nhật mã Apps Script để hiện thư viện tài liệu trên Drive.')
        :esc(e.message);
      if(isM()&&/bản cũ/.test(err))Drive.noteVersion(1);
    }
    lastLoad=Date.now();loading=false;paint();
  }
  async function share(on){
    if(on&&!confirm('Bật chia sẻ bằng đường link? Bất kỳ ai có đường link tới tài liệu trong thư mục này đều xem được (chỉ xem, không sửa).'))return;
    sharing=true;paintTop();
    try{const j=await Drive.call('shareReading',{on});if(data){data.share=j.share||'';try{localStorage.setItem(CACHE,JSON.stringify(data));}catch(e){}}toast(on?'Đã bật chia sẻ bằng đường link':'Đã tắt chia sẻ');}
    catch(e){toast((on?'Chưa bật được chia sẻ: ':'Chưa tắt được chia sẻ: ')+e.message);}
    sharing=false;paintTop();
  }
  view.addEventListener('click',e=>{const t=e.target.closest('[data-ract]');if(!t||!el('rB'))return;const a=t.dataset.ract;
    if(a==='reload'){if(isM()&&gh.owner)Profile.loadSnap().then(paint);load();}else if(a==='share-on')share(true);else if(a==='share-off')share(false);});
  view.addEventListener('change',e=>{const t=e.target;
    if(t.dataset&&t.dataset.rread!==undefined&&!isM()){
      if(!state.reading)state.reading={};
      if(t.checked)state.reading[t.dataset.rread]={d:todayStr(),t:t.dataset.rname};else delete state.reading[t.dataset.rread];
      touch();paint();return;}
    if(t.id==='rFilt'){filt=t.value;paint();}});
  view.addEventListener('input',e=>{if(e.target.id==='rSearch'){q=e.target.value;paintB();paintDrive();}});
  return {render};
})();


Auth.start();
</script>
